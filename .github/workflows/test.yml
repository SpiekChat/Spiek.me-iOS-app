name: SpiekCore tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: swift test (SpiekCore)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run the golden-vector and engine suite
        run: |
          cd SpiekCore
          swift test
