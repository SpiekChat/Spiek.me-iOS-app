			shellPath = /bin/sh;
			shellScript = "# Dropbox, iCloud Drive and Google Drive all resolve a sync clash by\n# leaving a SECOND copy of the file next to the original. This target uses a\n# file-system-synchronized group, so Xcode compiles every .swift it finds --\n# including those copies -- and the build then fails with\n# \"Invalid redeclaration of ...\", pointing at code that is perfectly fine.\n#\n# Catching it here turns a confusing compiler error into a plain instruction.\ncopies=$(find \"$SRCROOT\" \\\n    \\( -iname \"*conflict*\" -o -iname \"* [0-9].swift\" -o -iname \"*([0-9]).swift\" \\) \\\n    -not -path \"*/.build/*\" -not -path \"*/DerivedData/*\" 2>/dev/null || true)\n\nif [ -n \"$copies\" ]; then\n    echo \"$copies\" | while IFS= read -r file; do\n        [ -z \"$file\" ] && continue\n        echo \"error: sync conflict copy found -- delete this file and build again: $file\"\n    done\n    echo \"error: your cloud drive duplicated files in this project. Keep the project OUTSIDE a synced folder (~/Developer works well).\"\n    exit 1\nfi\n";
		};
